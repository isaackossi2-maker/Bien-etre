services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/appdb?schema=public
      # JWT_SECRET n'est volontairement pas défini ici : il est généré aléatoirement
      # au démarrage du conteneur (docker-entrypoint.sh) pour forcer la déconnexion
      # de tous les utilisateurs à chaque rebuild/redémarrage du backend.
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
      LIBRETRANSLATE_URL: http://libretranslate:5000
    depends_on:
      db:
        condition: service_healthy
      libretranslate:
        condition: service_healthy
    ports:
      - "4001:4000"
    volumes:
      # Fichiers PDF de la bibliothèque de documents (page Bible) : stockés sur disque plutôt
      # qu'en base (contrairement aux petites images), volume nommé pour survivre aux rebuilds.
      - documents_data:/app/uploads

  # Traduction automatique du contenu (examens, méditations, annonces...) quand un
  # utilisateur bascule la langue de l'appli. Auto-hébergé : pas de clé API, gratuit,
  # ne charge que les modèles français/anglais pour limiter le temps de démarrage.
  libretranslate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    command: ["--load-only", "en,fr", "--disable-web-ui"]
    volumes:
      - libretranslate_data:/home/libretranslate/.local
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/languages')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      args:
        # IP publique de la machine qui héberge coturn : indispensable pour que
        # les appels fonctionnent quand l'app est ouverte via le tunnel Cloudflare
        # (le nom de domaine du tunnel ne relaie pas le trafic TURN UDP/TCP).
        VITE_TURN_HOST: ${TURN_HOST:-132.213.72.90}
        # Identifiant TURN embarqué dans le bundle frontend (nécessaire : le navigateur doit le
        # connaître pour s'authentifier auprès de coturn). Vient de .env (non suivi par git),
        # jamais écrit en dur ici pour éviter de le recommiter par erreur.
        VITE_TURN_PASSWORD: ${TURN_PASSWORD:?Définis TURN_PASSWORD dans un fichier .env local (voir .env.example)}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  coturn:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    # Le mot de passe est passé ici plutôt qu'écrit dans turnserver.conf, pour qu'il ne finisse
    # jamais dans un fichier suivi par git.
    command: ["-c", "/etc/coturn/turnserver.conf", "--no-cli", "-u", "appperso:${TURN_PASSWORD:?Définis TURN_PASSWORD dans un fichier .env local (voir .env.example)}"]
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"

volumes:
  db_data:
  libretranslate_data:
  documents_data:
