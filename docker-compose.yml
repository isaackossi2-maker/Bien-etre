services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/appdb?schema=public
      # JWT_SECRET n'est volontairement pas défini ici : il est généré aléatoirement
      # au démarrage du conteneur (docker-entrypoint.sh) pour forcer la déconnexion
      # de tous les utilisateurs à chaque rebuild/redémarrage du backend.
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4001:4000"

  frontend:
    build:
      context: ./frontend
      args:
        # IP publique de la machine qui héberge coturn : indispensable pour que
        # les appels fonctionnent quand l'app est ouverte via le tunnel Cloudflare
        # (le nom de domaine du tunnel ne relaie pas le trafic TURN UDP/TCP).
        VITE_TURN_HOST: ${TURN_HOST:-132.213.72.90}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  coturn:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    command: ["-c", "/etc/coturn/turnserver.conf", "--no-cli"]
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"

volumes:
  db_data:
