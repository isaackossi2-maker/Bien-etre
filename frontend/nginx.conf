server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Relevé pour accepter les messages vocaux encodés en base64
    client_max_body_size 20m;

    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1024;

    # Texte biblique statique (~5 Mo) : ne change jamais, on le laisse en cache longtemps.
    location = /bible-lsg.json {
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location = /bible-kjv.json {
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Les fichiers dans /assets/ ont un hash dans leur nom (Vite) : sûrs à mettre en
    # cache indéfiniment, une nouvelle version aura toujours un nom de fichier différent.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html référence les fichiers hashés ci-dessus : il ne doit JAMAIS être mis en
    # cache, sinon le navigateur (ou un proxy) peut continuer à servir une ancienne page
    # qui pointe vers un bundle JS obsolète après un déploiement.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws {
        proxy_pass http://backend:4000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
