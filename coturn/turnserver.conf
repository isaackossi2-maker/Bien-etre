# Serveur TURN auto-hébergé pour fiabiliser les appels voix/vidéo (WebRTC)
# quand la connexion pair-à-pair directe échoue (réseaux restrictifs / NAT strict).

listening-port=3478

# Plage de ports utilisée pour relayer le flux média (doit correspondre aux ports
# publiés dans docker-compose.yml).
min-port=49160
max-port=49200

fingerprint
lt-cred-mech
realm=appperso.local

# Identifiants statiques (utilisateur:mot de passe). Changez-les avant tout
# déploiement autre que local — ils sont aussi utilisés côté frontend
# (frontend/src/call/CallContext.tsx).
user=appperso:f0b034313509e2c42d09aa63

no-cli
no-multicast-peers
stale-nonce=600
