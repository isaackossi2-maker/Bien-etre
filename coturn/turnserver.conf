# Serveur TURN auto-hébergé pour fiabiliser les appels voix/vidéo (WebRTC)
# quand la connexion pair-à-pair directe échoue (réseaux restrictifs / NAT strict).

listening-port=3478

# Plage de ports utilisée pour relayer le flux média (doit correspondre aux ports
# publiés dans docker-compose.yml).
min-port=49160
max-port=49200

fingerprint
lt-cred-mech
realm=appperso.local

# Les identifiants statiques (utilisateur:mot de passe) ne sont volontairement PAS écrits ici :
# ce fichier est suivi par git. Ils sont passés au démarrage via l'option -u du conteneur
# (voir docker-compose.yml), à partir de la variable d'environnement TURN_PASSWORD définie dans
# un fichier .env local (non suivi par git — voir .env.example à la racine).

no-cli
no-multicast-peers
stale-nonce=600
